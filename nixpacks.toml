[phases.setup]
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip", "gcc", "zlib", "librsvg"]

[phases.install]
cmds = [
  "npm install --omit=dev",
  "python3 -m pip install --upgrade pip",
  "python3 -m venv .venv",
  ".venv/bin/pip install -r requirements.txt"
]

[start]
cmd = "export PATH=$(pwd)/.venv/bin:$PATH && export INVENT_WARP_PYTHON=$(pwd)/.venv/bin/python3 && node server.js"
