[phases.setup]
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip", "gcc", "zlib", "librsvg"]

[phases.install]
cmds = [
  "npm install --omit=dev",
  "python3 -m pip install --upgrade pip",
  "python3 -m pip install --target=/app/pydeps -r requirements.txt"
]

[start]
cmd = "export PYTHONPATH=/app/pydeps:$PYTHONPATH && export PATH=/app/pydeps/bin:$PATH && node server.js"

[variables]
PYTHONPATH = "/app/pydeps"
