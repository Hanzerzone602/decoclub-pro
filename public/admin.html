<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin · DecoClub Pro</title>
  <link rel="icon" href="/logo.svg" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="side">
      <a class="brand" href="/"><img src="/logo.svg" alt="" /> DECOCLUB PRO</a>
      <p class="side-kicker">Admin</p>
      <button class="linkish active" data-view="users">Users</button>
      <button class="linkish" data-view="shops">Shops</button>
      <button class="linkish" data-view="settings">Pricing</button>
      <p class="muted" id="who" style="margin-top:auto;font-size:12px;padding:10px"></p>
      <button class="btn ghost small" id="logout">Log out</button>
    </aside>
    <main class="main" id="main"></main>
  </div>
  <script src="/admin.js"></script>
</body>
</html>
