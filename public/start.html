<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Start a job · DecoClub Pro</title>
  <link rel="icon" href="/logo.svg" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar"><a class="brand" href="/"><img src="/logo.svg" alt="" /> DECOCLUB PRO</a></header>
  <main class="auth-box">
    <div class="kicker">Start a job</div>
    <p class="muted">Opening the floor…</p>
  </main>
  <script>
    (function () {
      var METHODS = ["dtf","uvdtf","uv","vinyl","laser","sticker","hat","apparel","patch","embroidery","sublimation","rhinestone","sign"];
      var q = new URLSearchParams(location.search).get("method") || "";
      var stored = sessionStorage.getItem("decoclub_start_method") || "";
      var method = METHODS.indexOf(q) !== -1 ? q : (METHODS.indexOf(stored) !== -1 ? stored : "");
      if (method) sessionStorage.setItem("decoclub_start_method", method);
      var qs = method ? ("?method=" + encodeURIComponent(method) + "&station=art") : "";
      fetch("/api/me").then(function (r) { return r.json(); }).then(function (data) {
        if (data.user) location.replace("/app.html" + qs);
        else location.replace("/signup.html" + (method ? "?method=" + encodeURIComponent(method) : ""));
      }).catch(function () {
        location.replace("/signup.html" + (method ? "?method=" + encodeURIComponent(method) : ""));
      });
    })();
  </script>
</body>
</html>
