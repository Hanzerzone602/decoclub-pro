<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Make · DecoClub Pro</title>
  <link rel="icon" href="/logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="side">
      <a class="brand" href="/"><img src="/logo.png" alt="" id="sideLogo" /> <span id="sideName">DECOCLUB PRO</span></a>
      <p class="side-kicker">Shop</p>
      <button class="linkish active" data-view="make">Make</button>
      <button class="linkish" data-view="board">Jobs</button>
      <button class="linkish" data-view="job" id="navJob" style="display:none">Open job</button>
      <button class="linkish" data-view="clients" id="navClients">Clients</button>
      <a class="linkish" id="navOffice" href="/admin.html" style="display:none">Office</a>
      <button class="linkish" data-view="settings">Settings</button>
      <p class="muted" id="who" style="margin-top:auto;font-size:12px;padding:10px"></p>
      <button class="btn ghost small" id="logout">Log out</button>
    </aside>
    <main class="main" id="main"></main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
