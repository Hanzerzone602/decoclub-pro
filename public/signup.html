<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account · DecoClub Pro</title>
  <link rel="icon" href="/logo.svg" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="auth-page">
  <header class="topbar"><a class="brand" href="/"><img src="/logo.svg" alt="" /> DECOCLUB PRO</a></header>
  <form class="auth-box" id="form">
    <div class="kicker">Seven-day trial for shops</div>
    <h1>Open the shop</h1>
    <p class="muted" id="methodHint">Full floor from the first job.</p>
    <label>Your name</label><input name="name" required />
    <label>Shop name</label><input name="shopName" placeholder="Westside Press" />
    <label>Email</label><input name="email" type="email" required />
    <label>Password</label><input name="password" type="password" minlength="6" required />
    <label>Account type</label>
    <select name="role">
      <option value="shop">Shop (full floor)</option>
      <option value="client">Client (proofs and assigned jobs)</option>
    </select>
    <p class="notice" id="err"></p>
    <button class="btn" type="submit">Create account</button>
    <p class="muted" style="margin-top:18px">Already have a login? <a href="/login.html" id="altAuth">Log in</a></p>
  </form>
  <script>
    (function () {
      var METHODS = ["dtf","uvdtf","uv","vinyl","laser","sticker","hat","apparel","patch","embroidery","sublimation","rhinestone","sign"];
      var LABELS = { dtf: "DTF", uvdtf: "UV DTF", uv: "UV print", vinyl: "Vinyl", laser: "Laser", sticker: "Stickers", hat: "Hats", apparel: "Apparel", patch: "Patches", embroidery: "Embroidery", sublimation: "Sublimation", rhinestone: "Rhinestone", sign: "Signs" };
      var q = new URLSearchParams(location.search).get("method") || "";
      var stored = sessionStorage.getItem("decoclub_start_method") || "";
      var method = METHODS.indexOf(q) !== -1 ? q : (METHODS.indexOf(stored) !== -1 ? stored : "");
      if (method) {
        sessionStorage.setItem("decoclub_start_method", method);
        document.getElementById("altAuth").href = "/login.html?method=" + encodeURIComponent(method);
        var hint = document.getElementById("methodHint");
        if (hint) hint.textContent = "After you open the shop, we will start a " + (LABELS[method] || method) + " job on Art.";
      }
      document.getElementById("form").onsubmit = async (e) => {
        e.preventDefault();
        const res = await fetch("/api/signup", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.fromEntries(new FormData(e.target).entries())) });
        const data = await res.json();
        if (!res.ok) { document.getElementById("err").textContent = data.error; return; }
        location.href = method ? "/app.html?method=" + encodeURIComponent(method) + "&station=art" : "/app.html";
      };
    })();
  </script>
</body>
</html>
