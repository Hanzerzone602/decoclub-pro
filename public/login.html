<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in · DecoClub Pro</title>
  <link rel="icon" href="/logo.svg" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Syne:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="metal-bar"></div>
  <header class="topbar">
    <a class="brand" href="/"><img src="/logo.svg" alt="" /> DECOCLUB PRO</a>
  </header>
  <form class="auth-box" id="form">
    <div class="kicker">Shop bench</div>
    <h1 style="font-size:32px;margin:0">Log in</h1>
    <label>Email</label>
    <input name="email" type="email" value="owner@anvil.local" required />
    <label>Password</label>
    <input name="password" type="password" value="anvil123" required />
    <p class="notice" id="err"></p>
    <button class="btn" type="submit">Enter shop</button>
    <p class="muted">No account? <a href="/signup.html">Create one</a></p>
  </form>
  <script>
    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: fd.get("email"), password: fd.get("password") }),
      });
      const data = await res.json();
      if (!res.ok) { document.getElementById("err").textContent = data.error; return; }
      location.href = "/app.html";
    };
  </script>
</body>
</html>
